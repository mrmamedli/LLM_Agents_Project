<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">StudyHub</h1>
    <nav id="tabs" class="tabs" aria-label="Предметы"></nav>
    <form id="add-subject" class="add-subject" autocomplete="off">
      <input id="subject-name" type="text" placeholder="Новый предмет" maxlength="80" required>
      <button class="btn" type="submit">Добавить</button>
    </form>
  </header>

  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
